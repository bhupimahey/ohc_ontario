name: Deploy to cPanel Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ohc.bhupimahey.in
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via rsync to cPanel
        uses: burnett01/rsync-deployments@v8
        with:
          # Sync repo root -> subdomain document root (PRD_APP_DIR).
          # .env and .htaccess on production are never overwritten or deleted.
          switches: >-
            -avzr
            --delete
            --exclude='.env'
            --exclude='.htaccess'
            --exclude='.git/'
            --exclude='.github/'
            --exclude='.gitignore'
            --exclude='.ftpquota'
            --exclude='tests/'
            --exclude='writable/cache/'
            --exclude='writable/logs/'
            --exclude='writable/session/'
            --exclude='writable/debugbar/'
            --exclude='writable/uploads/'
            --exclude='*.xlsx'
          path: ./
          remote_path: ${{ secrets.PRD_APP_DIR }}
          remote_host: ${{ secrets.PRD_HOST }}
          remote_user: ${{ secrets.PRD_USER }}
          remote_key: ${{ secrets.PRD_SSH_KEY }}

      # First-time only: create .env / .htaccess from examples if missing.
      # Existing production files are never overwritten.
      - name: Seed production .env and .htaccess if missing
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRD_HOST }}
          username: ${{ secrets.PRD_USER }}
          key: ${{ secrets.PRD_SSH_KEY }}
          script: |
            set -e
            APP_DIR="${{ secrets.PRD_APP_DIR }}"
            cd "$APP_DIR"

            if [ ! -f .env ]; then
              if [ -f .env.example ]; then
                cp .env.example .env
                echo "Created .env from .env.example"
              else
                echo "WARNING: .env missing and .env.example not found"
              fi
            else
              echo "Keeping existing .env"
            fi

            if [ ! -f .htaccess ]; then
              if [ -f .htaccess.example ]; then
                cp .htaccess.example .htaccess
                echo "Created .htaccess from .htaccess.example"
              else
                echo "WARNING: .htaccess missing and .htaccess.example not found"
              fi
            else
              echo "Keeping existing .htaccess"
            fi

            mkdir -p writable/cache writable/logs writable/session writable/uploads writable/debugbar
            chmod -R u+rwX writable || true
